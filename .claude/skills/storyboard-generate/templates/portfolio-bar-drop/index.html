<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#1B3A2F;font-family:Inter,system-ui,sans-serif}
  #root{position:relative;width:1920px;height:1080px}
  .title{position:absolute;top:110px;left:160px;color:#fff;font-size:66px;font-weight:800;letter-spacing:-1px}
  .sub{position:absolute;top:198px;left:160px;color:#8BE01E;font-size:34px;font-weight:600}
  .track{position:absolute;left:160px;bottom:150px;width:230px;height:660px;background:rgba(255,255,255,.08);border-radius:16px}
  .bar{position:absolute;left:160px;bottom:150px;width:230px;height:660px;background:#8BE01E;border-radius:16px;transform-origin:bottom center}
  .readout{position:absolute;left:440px;bottom:150px;will-change:transform}
  .pct{color:#fff;font-size:132px;font-weight:800;line-height:1}
  .cap{color:#cfe9c9;font-size:34px;font-weight:600;margin-top:6px}
  .axlab{position:absolute;left:440px;bottom:132px;color:rgba(255,255,255,.6);font-size:24px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
  <div class="title">Bull-market portfolio</div>
  <div class="sub">carried into bear-market conditions</div>
  <div class="track"></div>
  <div class="bar" id="bar"></div>
  <div class="axlab">0%</div>
  <div class="readout" id="readout">
    <div class="pct" id="pct">100%</div>
    <div class="cap">Portfolio value</div>
  </div>
</div>
<script>
  gsap.set("#readout", {y: -660});                    // start aligned to bar top
  const tl = gsap.timeline({paused:true});
  tl.to({}, {duration:1});                             // hold on 100%
  tl.to("#bar",     {duration:1.6, scaleY:0.38, ease:"power3.inOut"}, 1);
  tl.to("#readout", {duration:1.6, y:-251, ease:"power3.inOut",
        onUpdate(){document.getElementById('pct').textContent =
                   Math.round(gsap.getProperty("#bar",'scaleY')*100)+'%';}}, 1);
  tl.to("#bar", {duration:0.4, backgroundColor:"#E5484D"}, 1.6);
  tl.to("#pct", {duration:0.4, color:"#E5484D"}, 1.6);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  window.__timelines["root"] = tl;
</script>
</body>
</html>
